# 工作流配置，可以定义多个不同的构建流程
workflows:
    # 这是给 iOS 平台定义的一个工作流
    ios-release-workflow:
        name: iOS Build for App Store Connect
        # 选择构建环境，mac_mini_m2 对于大多数项目性价比很高
        instance_type: mac_mini_m2
        # 最大构建时间（分钟）
        max_build_duration: 60

        environment:
            # 这里导入我们在 Codemagic 后台要设置的敏感信息组
            groups:
                - ios_credentials # 专门用来存放 iOS 证书和 API 密钥的组
            node: latest
            xcode: latest

        # 定义构建过程中要执行的脚本
        scripts:
            # 1. 安装 Node.js 依赖
            - name: Install npm dependencies
              script: |
                  npm ci

            # 2. 构建前端代码（生成 dist 文件夹）
            - name: Build web assets
              script: |
                  npm run build

            # 3. 重新生成 iOS 项目
            - name: Regenerate iOS project
              script: |
                  # 删除现有的 ios 文件夹
                  rm -rf ios
                  
                  # 重新添加 iOS 平台
                  npx cap add ios
                  
                  # 同步项目
                  npx cap sync ios
                  
                  # 删除可能残留的 Podfile
                  rm -f ios/App/Podfile || true
                  rm -f ios/App/Podfile.lock || true

            # 4. 获取 iOS 签名文件（自动创建证书和描述文件）
            - name: Fetch iOS signing files
              script: |
                  app-store-connect fetch-signing-files "com.lingumate.app" \
                    --type IOS_APP_STORE \
                    --create \
                    --platform IOS

            # 5. 直接构建，让 Xcode 自动处理签名
            - name: Build ipa with automatic signing
              script: |
                  # 设置项目路径
                  PROJECT_PATH="ios/App/App.xcodeproj"
                  SCHEME="App"
                  ARCHIVE_PATH="build/App.xcarchive"
                  EXPORT_PATH="build"
                  
                  # 创建 exportOptions.plist 文件（使用自动签名）
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                      <key>signingStyle</key>
                      <string>automatic</string>
                  </dict>
                  </plist>
                  EOF
                  
                  # 清理之前的构建
                  xcodebuild clean \
                    -project "$PROJECT_PATH" \
                    -scheme "$SCHEME" \
                    -allowProvisioningUpdates || true
                  
                  # 归档（Archive）- 让 Xcode 自动处理签名
                  xcodebuild archive \
                    -project "$PROJECT_PATH" \
                    -scheme "$SCHEME" \
                    -archivePath "$ARCHIVE_PATH" \
                    -allowProvisioningUpdates \
                    -destination 'generic/platform=iOS'
                  
                  # 从归档导出 IPA
                  xcodebuild -exportArchive \
                    -archivePath "$ARCHIVE_PATH" \
                    -exportPath "$EXPORT_PATH" \
                    -exportOptionsPlist exportOptions.plist \
                    -allowProvisioningUpdates

        # 指定 Codemagic 在构建完成后需要提取的文件
        artifacts:
            - build/*.ipa
            - build/*.xcarchive
            - /tmp/xcodebuild_logs/*.log
            - exportOptions.plist

        # 配置构建产物的发布选项
        publishing:
            # 自动将 .ipa 上传到 App Store Connect
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true