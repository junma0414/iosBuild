workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.lingumate.app"

      node: latest
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web assets with production env
        script: |
          cp .env.production .env
          NODE_ENV=production npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
          rm -f ios/App/Podfile
          rm -f ios/App/Podfile.lock
          mkdir -p ios/App/CapApp-SPM/Sources/CapApp-SPM
          cat > ios/App/CapApp-SPM/Package.swift <<EOF
          // swift-tools-version:5.3
          import PackageDescription
          
          let package = Package(
              name: "CapApp-SPM",
              products: [
                  .library(name: "CapApp-SPM", targets: ["CapApp-SPM"])
              ],
              targets: [
                  .target(
                      name: "CapApp-SPM",
                      path: "Sources/CapApp-SPM"
                  )
              ]
          )
          EOF
          cat > ios/App/CapApp-SPM/Sources/CapApp-SPM/Empty.swift <<EOF
          // This file is intentionally empty to satisfy SPM requirements.
          EOF

      - name: Fetch signing files via API
        script: |
          echo "=== Fetching signing files via API ==="
          app-store-connect fetch-signing-files "com.lingumate.app" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS
          
          echo "=== Installed profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          
          # 获取实际的 profile 名称
          for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            if [ -f "$profile" ]; then
              NAME=$(security cms -D -i "$profile" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin 2>/dev/null)
              echo "Found profile: $NAME"
              echo "PROFILE_NAME=$NAME" >> $CM_ENV
            fi
          done

      - name: Archive iOS app
        script: |
          set -e
          set -o pipefail
          
          # 使用 API 下载的 profile 名称
          PROFILE_NAME=${PROFILE_NAME:-"AIVANA_codemagic"}
          echo "Using profile: $PROFILE_NAME"

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Create ExportOptions.plist
        script: |
          PROFILE_NAME=${PROFILE_NAME:-"AIVANA_codemagic"}
          cat > $CM_BUILD_DIR/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lingumate.app</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        script: |
          set -e
          set -o pipefail

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/exportOptions.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/App.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com
        notify:
          success: true
          failure: true