workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        # 证书和描述文件放在 environment 的同级
        certificates:
            - linguamate_distribution_cert
        provisioning_profiles:
            - linguamate_distribution_provision
        scripts:
            - name: Install npm dependencies
              script: npm ci
                  
            - name: Build web assets
              script: npm run build
                  
            - name: Generate iOS project
              script: |
                  rm -rf ios
                  npx cap add ios
                  npx cap sync ios
                  
            - name: Archive
              script: |
                  set -o pipefail
                  xcodebuild archive \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" \
                    -archivePath "build/App.xcarchive" \
                    -destination 'generic/platform=iOS' \
                    -allowProvisioningUpdates \
                    DEVELOPMENT_TEAM=${TEAM_ID} \
                    CODE_SIGN_STYLE=Manual \
                    PROVISIONING_PROFILE_SPECIFIER="AIVANA_codemagic"
                  
            - name: Export IPA
              script: |
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store-connect</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                      <key>provisioningProfiles</key>
                      <dict>
                          <key>com.lingumate.app</key>
                          <string>AIVANA_codemagic</string>
                      </dict>
                  </dict>
                  </plist>
                  EOF
                  
                  if [ -d "build/App.xcarchive" ]; then
                    xcodebuild -exportArchive \
                      -archivePath "build/App.xcarchive" \
                      -exportPath "build/" \
                      -exportOptionsPlist exportOptions.plist \
                      -allowProvisioningUpdates
                  else
                    echo "Archive failed, skipping export"
                    exit 1
                  fi
                  
        artifacts:
            - build/*.ipa
            - build/App.xcarchive
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true