workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lingumate.app
      vars:
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: |
          cp .env.production .env
          NODE_ENV=production npm run build

      - name: Setup iOS project
        script: |
          rm -rf ios
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/com.apple.dt.Xcode
          npx cap add ios
          # 删除 cap sync 之前可能生成的 SPM 工件
          npx cap sync ios
          rm -rf ios/CapApp-SPM
          # 修改 deployment target 并禁用 Pod 签名
          sed -i '' 's/platform :ios, '"'"'[0-9.]*'"'"'/platform :ios, '"'"'15.0'"'"'/' ios/App/Podfile
          echo "
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              end
            end
          end
          " >> ios/App/Podfile
          cd ios/App && pod install --repo-update
          cd ../..
          ls -la ios/App/

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6767740956" 2>/dev/null || echo "0")
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Latest TestFlight build number: $LATEST_BUILD_NUMBER"
          echo "New build number: $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Configure code signing
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com
        notify:
          success: true
          failure: true
