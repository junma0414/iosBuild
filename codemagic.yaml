workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lingumate.app
      vars:
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: |
          cp .env.production .env
          NODE_ENV=production npm run build

      - name: Setup iOS project and fix storyboard crash
        script: |
          rm -rf ios
          npx cap add ios
          # 创建空 Podfile 以避免 cap sync 报错
          mkdir -p ios/App
          cat > ios/App/Podfile <<EOF
          platform :ios, '14.0'
          target 'App' do
          end
          EOF
          npx cap sync ios
          # 确认项目文件存在
          ls -la ios/App/

          # ============================================
          # 彻底移除故事板文件及 Xcode 项目引用
          # ============================================
          # 1. 删除故事板文件
          rm -f ios/App/App/Base.lproj/Main.storyboard
          rm -f ios/App/App/Base.lproj/LaunchScreen.storyboard
          
          # 2. 从 project.pbxproj 中移除故事板引用
          cd ios/App
          # 删除包含 Main.storyboard 或 LaunchScreen.storyboard 的行
          sed -i '' '/Main.storyboard/d' App.xcodeproj/project.pbxproj
          sed -i '' '/LaunchScreen.storyboard/d' App.xcodeproj/project.pbxproj
          cd ../..
          
          # 3. 清空 Info.plist 中的故事板引用
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName ''" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :UIMainStoryboardFile ''" ios/App/App/Info.plist
          
          # 4. 替换 AppDelegate.swift 为代码加载版本
          cat > ios/App/App/AppDelegate.swift <<'EOF'
          import UIKit
          import Capacitor

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  // 创建窗口
                  window = UIWindow(frame: UIScreen.main.bounds)
                  
                  // 创建 Capacitor 视图控制器
                  let bridgeViewController = CAPBridgeViewController()
                  
                  window?.rootViewController = bridgeViewController
                  window?.makeKeyAndVisible()
                  
                  return true
              }

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          }
          EOF

      - name: Configure code signing
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com
        notify:
          success: true
          failure: true