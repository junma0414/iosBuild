workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lingumate.app
      vars:
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: |
          echo "=== Installing npm dependencies ==="
          npm ci
          echo "npm dependencies installed successfully"

      - name: Fix dependency conflicts
        script: |
          echo "=== Fixing Capacitor dependency conflicts ==="
          
          # 统一 Capacitor 版本到 7.x
          echo "Updating Capacitor core to version 7..."
          npm install @capacitor/core@7 @capacitor/ios@7 @capacitor/cli@7
          
          # 更新 plugins 到兼容版本
          echo "Updating Capacitor plugins..."
          npm install @capacitor/app@7 @capacitor/haptics@7 @capacitor/keyboard@7 @capacitor/status-bar@7
          
          # 更新 purchases-capacitor 到支持 Capacitor 7 的版本
          echo "Updating purchases-capacitor..."
          npm install purchases-capacitor@latest
          
          # 检查 apple-sign-in 的兼容性
          echo "Updating apple-sign-in..."
          npm install @capacitor-community/apple-sign-in@latest
          
          echo "Updated dependencies:"
          npm list @capacitor/core @capacitor/ios purchases-capacitor || true

      - name: Build web assets
        script: |
          echo "=== Building web assets ==="
          cp .env.production .env
          NODE_ENV=production npm run build
          echo "Web assets built successfully"
          ls -la dist/ || echo "dist directory not found"

      - name: Setup iOS project
        script: |
          echo "=== Setting up iOS project ==="
          
          echo "Removing existing ios directory..."
          rm -rf ios
          
          echo "Adding iOS platform with Capacitor..."
          npx cap add ios
          
          echo "Creating Podfile..."
          mkdir -p ios/App
          cat > ios/App/Podfile <<'EOF'
          platform :ios, '14.0'
          
          target 'App' do
            use_frameworks! :linkage => :static
          end
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
          EOF
          
          cat ios/App/Podfile
          
          echo "Running cap sync ios..."
          npx cap sync ios
          
          echo "Running pod install..."
          cd ios/App && pod install && cd ../..
          
          echo "=== Current directory structure ==="
          ls -la ios/App/
          
          echo "=== Creating shared scheme in the correct path ==="
          # 注意：我们现在在项目根目录，需要创建 ios/App/App.xcodeproj 下的 scheme
          mkdir -p ios/App/App.xcodeproj/xcshareddata/xcschemes
          
          cat > ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme <<'SCHEME_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1510" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference
                    BuildableIdentifier = "primary"
                    BlueprintIdentifier = "13B07F861A680F5B00A75B9A"
                    BuildableName = "App.app"
                    BlueprintName = "App"
                    ReferencedContainer = "container:App.xcodeproj">
                  </BuildableReference>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <TestAction buildConfiguration = "Debug" selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv = "YES">
              <Testables>
              </Testables>
            </TestAction>
            <LaunchAction buildConfiguration = "Debug" selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle = "0" useCustomWorkingDirectory = "NO" ignoresPersistentStateOnLaunch = "NO" debugDocumentVersioning = "YES" debugServiceExtension = "internal" allowLocationSimulation = "YES">
              <BuildableProductRunnable runnableDebuggingMode = "0">
                <BuildableReference
                  BuildableIdentifier = "primary"
                  BlueprintIdentifier = "13B07F861A680F5B00A75B9A"
                  BuildableName = "App.app"
                  BlueprintName = "App"
                  ReferencedContainer = "container:App.xcodeproj">
                </BuildableReference>
              </BuildableProductRunnable>
            </LaunchAction>
            <ProfileAction buildConfiguration = "Release" shouldUseLaunchSchemeArgsEnv = "YES" savedToolIdentifier = "" useCustomWorkingDirectory = "NO" debugDocumentVersioning = "YES">
              <BuildableProductRunnable runnableDebuggingMode = "0">
                <BuildableReference
                  BuildableIdentifier = "primary"
                  BlueprintIdentifier = "13B07F861A680F5B00A75B9A"
                  BuildableName = "App.app"
                  BlueprintName = "App"
                  ReferencedContainer = "container:App.xcodeproj">
                </BuildableReference>
              </BuildableProductRunnable>
            </ProfileAction>
            <AnalyzeAction buildConfiguration = "Debug">
            </AnalyzeAction>
            <ArchiveAction buildConfiguration = "Release" revealArchiveInOrganizer = "YES">
            </ArchiveAction>
          </Scheme>
          SCHEME_EOF
          
          echo "Scheme created at: ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme"
          ls -la ios/App/App.xcodeproj/xcshareddata/xcschemes/
          
          echo "=== Creating Main.storyboard ==="
          mkdir -p ios/App/App/Base.lproj
          cat > ios/App/App/Base.lproj/Main.storyboard <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="14111" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" useTraitCollections="YES" colorMatched="YES" initialViewController="BYZ-38-t0r">
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="14088"/>
              </dependencies>
              <scenes>
                  <scene sceneID="tne-QT-ifu">
                      <objects>
                          <viewController id="BYZ-38-t0r" customClass="CAPBridgeViewController" customModule="Capacitor" sceneMemberID="viewController"/>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="dkx-z0-nzr" sceneMemberID="firstResponder"/>
                      </objects>
                  </scene>
              </scenes>
          </document>
          EOF
          
          echo "=== Creating LaunchScreen.storyboard ==="
          cat > ios/App/App/Base.lproj/LaunchScreen.storyboard <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="14111" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="14088"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="600" height="600"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <subviews>
                                      <label opaque="NO" userInteractionEnabled="NO" contentMode="left" horizontalHuggingPriority="251" verticalHuggingPriority="251" text="Loading..." textAlignment="center" lineBreakMode="tailTruncation" baselineAdjustment="alignBaselines" adjustsFontSizeToFit="NO" translatesAutoresizingMaskIntoConstraints="NO" id="lwH-C2-qbZ">
                                          <rect key="frame" x="264" y="289" width="72" height="21"/>
                                          <fontDescription key="fontDescription" type="system" pointSize="17"/>
                                          <nil key="textColor"/>
                                          <nil key="highlightedColor"/>
                                      </label>
                                  </subviews>
                                  <color key="backgroundColor" white="1" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                                  <constraints>
                                      <constraint firstItem="lwH-C2-qbZ" firstAttribute="centerX" secondItem="Ze5-6b-2t3" secondAttribute="centerX" id="X0l-lz-1Nv"/>
                                      <constraint firstItem="lwH-C2-qbZ" firstAttribute="centerY" secondItem="Ze5-6b-2t3" secondAttribute="centerY" id="vO0-Hf-9qJ"/>
                                  </constraints>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          EOF
          
          echo "=== Updating Info.plist ==="
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :UIMainStoryboardFile Main" ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :UIMainStoryboardFile string Main" ios/App/App/Info.plist
          
          echo "=== Creating AppDelegate.swift ==="
          cat > ios/App/App/AppDelegate.swift <<'EOF'
          import UIKit
          import Capacitor

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let bridgeViewController = CAPBridgeViewController()
                  window?.rootViewController = bridgeViewController
                  window?.makeKeyAndVisible()
                  return true
              }

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          }
          EOF
          
          echo "=== Final iOS project structure ==="
          find ios/App -type f -name "*.swift" -o -name "*.storyboard" -o -name "*.plist" -o -name "*.xcscheme" | head -20
          
          echo "iOS project setup completed"

      - name: Increment build number
        script: |
          echo "=== Incrementing build number ==="
          cd ios/App
          
          echo "Getting latest TestFlight build number..."
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6767740956" 2>/dev/null || echo "0")
          echo "Latest TestFlight build number: $LATEST_BUILD_NUMBER"
          
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "New build number: $NEW_BUILD_NUMBER"
          
          echo "Updating CFBundleVersion in Info.plist..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEW_BUILD_NUMBER" App/Info.plist
          
          echo "Updated Info.plist:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist
          
          cd ../..

      - name: Configure code signing
        script: |
          echo "=== Configuring code signing ==="
          echo "Adding certificates to keychain..."
          keychain add-certificates
          
          echo "Using provisioning profiles..."
          xcode-project use-profiles
          
          echo "Code signing configured"

      - name: Build and export IPA
        script: |
          echo "=== Starting IPA build process ==="
          cd ios/App
          
          echo "Current directory: $(pwd)"
          echo "=== Listing project contents ==="
          ls -la
          
          echo "=== Checking project.pbxproj ==="
          ls -la App.xcodeproj/
          
          echo "=== Checking schemes ==="
          find . -name "*.xcscheme" -type f
          
          echo "=== Verifying scheme exists ==="
          if [ -f "App.xcodeproj/xcshareddata/xcschemes/App.xcscheme" ]; then
            echo "Scheme file found at App.xcodeproj/xcshareddata/xcschemes/App.xcscheme"
            cat App.xcodeproj/xcshareddata/xcschemes/App.xcscheme | head -20
          else
            echo "ERROR: Scheme file not found at App.xcodeproj/xcshareddata/xcschemes/App.xcscheme"
            exit 1
          fi
          
          echo "=== Listing available schemes with xcodebuild ==="
          xcodebuild -project App.xcodeproj -list || true
          
          echo "=== Building archive ==="
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -archivePath build/App.xcarchive \
            -configuration Release \
            -verbose \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit 1
          
          if [ $? -ne 0 ]; then
            echo "ERROR: Archive build failed"
            exit 1
          fi
          
          echo "Archive built successfully at: build/App.xcarchive"
          ls -la build/
          
          echo "=== Creating export options plist ==="
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>teamID</key>
            <string>${TEAM_ID:-}</string>
          </dict>
          </plist>
          EOF
          
          echo "Export options:"
          cat exportOptions.plist
          
          echo "=== Exporting IPA ==="
          mkdir -p build/ios/ipa
          
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -verbose \
            | xcpretty
          
          if [ $? -ne 0 ]; then
            echo "ERROR: IPA export failed"
            exit 1
          fi
          
          echo "=== Checking exported IPA ==="
          ls -la build/ios/ipa/
          
          if [ -f "build/ios/ipa/App.ipa" ]; then
            echo "SUCCESS: IPA file created at build/ios/ipa/App.ipa"
            ls -lh build/ios/ipa/App.ipa
          else
            echo "ERROR: IPA file not found!"
            find build -name "*.ipa" -type f
            exit 1
          fi
          
          echo "IPA build completed successfully"
          cd ../..

    artifacts:
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com
        notify:
          success: true
          failure: true