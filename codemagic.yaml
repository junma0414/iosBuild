workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials

      vars:
        BUNDLE_ID: "com.lingumate.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      node: latest
      xcode: latest

    scripts:
      # =========================
      # Install dependencies
      # =========================
      - name: Install npm dependencies
        script: |
          npm ci

      # =========================
      # Build frontend
      # =========================
      - name: Build web assets
        script: |
          cp .env.production .env
          NODE_ENV=production npm run build

      # =========================
      # Recreate iOS project
      # =========================
      - name: Recreate Capacitor iOS project
        script: |
          rm -rf ios

          npx cap add ios
          npx cap sync ios

      # =========================
      # CocoaPods install
      # =========================
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
          cd ../..

      # =========================
      # Initialize signing
      # =========================
      - name: Initialize keychain
        script: |
          keychain initialize

      # =========================
      # Fetch signing files
      # =========================
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      # =========================
      # Install certificates
      # =========================
      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      # =========================
      # Apply provisioning profiles
      # =========================
      - name: Configure code signing
        script: |
          xcode-project use-profiles

      # =========================
      # Resolve Swift Packages
      # =========================
      - name: Resolve Swift package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME"

      # =========================
      # Clean broken export settings
      # =========================
      - name: Clear export option overrides
        script: |
          unset XCODE_EXPORT_OPTIONS_PLIST
          unset CM_EXPORT_OPTIONS

      # =========================
      # Build IPA
      # =========================
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com
        notify:
          success: true
          failure: true