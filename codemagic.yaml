workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials

      vars:
        BUNDLE_ID: "com.lingumate.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

      node: latest
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: |
          cp .env.production .env
          NODE_ENV=production npm run build

      - name: Sync Capacitor iOS
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Resolve SPM dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Configure code signing
        script: xcode-project use-profiles

      - name: Archive iOS app
        script: |
          set -e
          set -o pipefail
          echo "Starting archive..."
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -verbose 2>&1 | tee archive.log
          echo "Archive finished with exit code $?"

      - name: Export IPA with detailed logging
        script: |
          set -e
          set -o pipefail
          echo "Creating exportOptions.plist..."
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
          echo "exportOptions.plist content:"
          cat exportOptions.plist
          
          echo "Starting export..."
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -verbose 2>&1 | tee export.log
          echo "Export finished with exit code $?"
          
          echo "Checking if IPA was created:"
          ls -la $CM_BUILD_DIR/build/ios/ipa/ || echo "No IPA directory"
          
      - name: List artifacts
        script: |
          echo "Final artifacts:"
          find $CM_BUILD_DIR/build -name "*.ipa" -o -name "*.xcarchive" | xargs ls -la || echo "No artifacts found"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/App.xcarchive
      - archive.log
      - export.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com
        notify:
          success: true
          failure: true