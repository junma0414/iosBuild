workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60

        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest

        scripts:
            - name: Install npm dependencies
              script: |
                  npm ci

            - name: Build web assets
              script: |
                  npm run build

            - name: Sync Capacitor iOS project
              script: |
                  npx cap add ios
                  # Capacitor 7 生成的 Podfile 需要修改 deployment target
                  sed -i '' 's/platform :ios, '"'"'[0-9.]*'"'"'/platform :ios, '"'"'15.0'"'"'/' ios/App/Podfile 2>/dev/null || true
                  # 在 Podfile 末尾添加 post_install 禁用 Pod 签名
                  echo '
                  post_install do |installer|
                    installer.pods_project.targets.each do |target|
                      target.build_configurations.each do |config|
                        config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                        config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                        config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                      end
                    end
                  end
                  ' >> ios/App/Podfile
                  npx cap sync ios

            - name: Fetch iOS signing files
              script: |
                  app-store-connect fetch-signing-files "com.lingumate.app" --type IOS_APP_STORE --create

            - name: Add certificates to keychain
              script: |
                  keychain add-certificates

            - name: Set up code signing settings
              script: |
                  xcode-project use-profiles

            - name: Increment build number
              script: |
                  cd ios/App
                  agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "6767740956")+ 1))

            - name: Build ipa
              script: |
                  xcode-project build-ipa \
                    --workspace "ios/App/App.xcworkspace" \
                    --scheme "App"

        artifacts:
            - build/ios/ipa/*.ipa
            - /tmp/xcodebuild_logs/*.log

        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true
