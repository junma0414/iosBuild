workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lingumate.app
      vars:
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: |
          cp .env.production .env
          NODE_ENV=production npm run build

      - name: Setup iOS project
        script: |
          rm -rf ios
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/com.apple.dt.Xcode
          npx cap add ios
          mkdir -p ios/App
          cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          # 注册 Google OAuth callback URL scheme (REVERSED_CLIENT_ID)
          /usr/libexec/PlistBuddy -c "Add CFBundleURLTypes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add CFBundleURLTypes:0 dict" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add CFBundleURLTypes:0:CFBundleURLSchemes array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.googleusercontent.apps.925702138089-qk3rm2dg8ig4ghase8ukiqv7avfto175" ios/App/App/Info.plist
          # 注册 Apple Sign-In callback URL scheme
          /usr/libexec/PlistBuddy -c "Add CFBundleURLTypes:1 dict" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add CFBundleURLTypes:1:CFBundleURLSchemes array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add CFBundleURLTypes:1:CFBundleURLSchemes:0 string com.lingumate.omnifamily" ios/App/App/Info.plist
          # 先执行 cap sync 让 Capacitor 注册所有 plugins 到 Xcode 项目
          npx cap sync ios
          # 设置 App target 的 deployment target 为 15.0（cap add 默认是 14.0，但 Capacitor 7 要求 15.0）
          /usr/libexec/PlistBuddy -c "Set:Project:Target:App:BuildSettings:IPHONEOS_DEPLOYMENT_TARGET 15.0" ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || \
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          # 再用自定义 Podfile 覆盖（设定 deployment target 15.0 避免 pod 冲突）
          cat > ios/App/Podfile <<'PODEOF'
          platform :ios, '15.0'
          target 'App' do
            use_frameworks! :linkage => :static
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios', :modular_headers => true
            pod 'CapacitorApp', :path => '../../node_modules/@capacitor/app'
            pod 'CapacitorBrowser', :path => '../../node_modules/@capacitor/browser'
            pod 'CapacitorDevice', :path => '../../node_modules/@capacitor/device'
            pod 'CapacitorPreferences', :path => '../../node_modules/@capacitor/preferences'
            pod 'CapacitorShare', :path => '../../node_modules/@capacitor/share'
            pod 'CapacitorCommunityTextToSpeech', :path => '../../node_modules/@capacitor-community/text-to-speech'
            pod 'RevenuecatPurchasesCapacitor', :path => '../../node_modules/@revenuecat/purchases-capacitor'
            pod 'CapacitorGoogleSignIn', :path => '../../node_modules/capacitor-google-sign-in'
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['ENABLE_APP_INTENTS_METADATA_GENERATION'] = 'NO'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          PODEOF
          npx cap sync ios
          cd ios/App && pod install --repo-update
          cd ../..
          ls -la ios/App/

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6767740956" 2>/dev/null || echo "0")
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Latest TestFlight build number: $LATEST_BUILD_NUMBER"
          echo "New build number: $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Configure code signing
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com
        notify:
          success: true
          failure: true
