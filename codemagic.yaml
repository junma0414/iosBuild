workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        scripts:
            - name: Install npm dependencies
              script: |
                  npm ci
                  
            - name: Build web assets
              script: |
                  npm run build
                  
            - name: Generate iOS project
              script: |
                  rm -rf ios
                  npx cap add ios
                  npx cap sync ios
                  
            - name: Debug - Check environment variables
              script: |
                  echo "=== Environment Variables ==="
                  echo "TEAM_ID = ${TEAM_ID}"
                  echo "KEY_ID = ${APP_STORE_CONNECT_KEY_IDENTIFIER:0:10}..."
                  echo "ISSUER_ID = ${APP_STORE_CONNECT_ISSUER_ID:0:10}..."
                  echo "Private key length = ${#APP_STORE_CONNECT_PRIVATE_KEY}"
                  echo ""
                  echo "=== Xcode version ==="
                  xcodebuild -version
                  echo ""
                  echo "=== Available schemes ==="
                  xcodebuild -project ios/App/App.xcodeproj -list
                  echo ""
                  echo "=== Certificates in keychain ==="
                  security find-identity -v -p apple || echo "No certificates found"
                  echo ""
                  echo "=== Provisioning profiles ==="
                  ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles directory"
                  
            - name: Set development team in project
              script: |
                  cd ios/App
                  echo "=== Setting DEVELOPMENT_TEAM in project.pbxproj ==="
                  sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${TEAM_ID};/g" App.xcodeproj/project.pbxproj
                  if ! grep -q "DEVELOPMENT_TEAM = ${TEAM_ID}" App.xcodeproj/project.pbxproj; then
                    sed -i '' "s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = ${TEAM_ID};/g" App.xcodeproj/project.pbxproj
                  fi
                  echo "DEVELOPMENT_TEAM set to ${TEAM_ID}"
                  
            - name: Archive
              script: |
                  set -o pipefail
                  echo "=== Starting Archive ==="
                  xcodebuild archive \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" \
                    -archivePath "build/App.xcarchive" \
                    -destination 'generic/platform=iOS' \
                    -allowProvisioningUpdates \
                    CODE_SIGN_STYLE=Manual \
                    DEVELOPMENT_TEAM=${TEAM_ID} \
                    PROVISIONING_PROFILE_SPECIFIER="APP ID for lingumate ios_app_store 1778428934" \
                    2>&1 | tee xcodebuild.log
                  
                  echo "=== Archive exit code: $? ==="
                  if [ ! -d "build/App.xcarchive" ]; then
                    echo "Archive directory not found!"
                    ls -la build/ 2>/dev/null || echo "No build directory"
                    exit 1
                  fi
                  echo "Archive created successfully"
                  
            - name: Export IPA
              script: |
                  echo "=== Starting Export ==="
                  
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                      <key>provisioningProfiles</key>
                      <dict>
                          <key>com.lingumate.app</key>
                          <string>APP ID for lingumate ios_app_store 1778428934</string>
                      </dict>
                  </dict>
                  </plist>
                  EOF
                  
                  echo "exportOptions.plist created:"
                  cat exportOptions.plist
                  
                  xcodebuild -exportArchive \
                    -archivePath "build/App.xcarchive" \
                    -exportPath "build/" \
                    -exportOptionsPlist exportOptions.plist \
                    -allowProvisioningUpdates \
                    2>&1 | tee export.log
                  
                  echo "=== Export exit code: $? ==="
                  echo "=== Checking for IPA ==="
                  ls -la build/*.ipa 2>/dev/null || echo "No IPA found"
                  
        artifacts:
            - build/*.ipa
            - build/*.xcarchive
            - xcodebuild.log
            - export.log
            - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/**/*.xcactivitylog
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true