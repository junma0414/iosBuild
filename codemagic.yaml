workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        scripts:
            - name: Install npm dependencies
              script: npm ci
                  
            - name: Build web assets
              script: npm run build
                  
            - name: Generate iOS project
              script: |
                  rm -rf ios
                  npx cap add ios
                  npx cap sync ios
                  
            - name: Fetch signing files via API
              script: |
                  echo "=== Fetch signing files ==="
                  app-store-connect fetch-signing-files "com.lingumate.app" \
                    --type IOS_APP_STORE \
                    --create \
                    --platform IOS
                  
                  echo "=== Files in provisioning profiles directory ==="
                  ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
                  
                  echo "=== Extracting all profile names ==="
                  for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
                    if [ -f "$profile" ]; then
                      echo "--- $(basename "$profile") ---"
                      security cms -D -i "$profile" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin 2>/dev/null || echo "Failed to read"
                    fi
                  done
                  
            - name: Setup keychain
              script: |
                  echo "=== Setup keychain ==="
                  keychain add-certificates
                  security unlock-keychain -p builder ~/Library/Keychains/login.keychain-db
                  security set-key-partition-list -S apple-tool:,apple: -s -k builder ~/Library/Keychains/login.keychain-db
                  echo "=== Available certificates ==="
                  security find-identity -v -p apple
                  
            - name: Archive - try automatic signing
              script: |
                  set -o pipefail
                  echo "=== Archive with automatic signing ==="
                  xcodebuild archive \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" \
                    -archivePath "build/App.xcarchive" \
                    -destination 'generic/platform=iOS' \
                    -allowProvisioningUpdates \
                    DEVELOPMENT_TEAM=${TEAM_ID} \
                    CODE_SIGN_STYLE=Automatic \
                    2>&1 | tee build.log
                  
            - name: Export IPA
              script: |
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store-connect</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                  </dict>
                  </plist>
                  EOF
                  
                  if [ -d "build/App.xcarchive" ]; then
                    xcodebuild -exportArchive \
                      -archivePath "build/App.xcarchive" \
                      -exportPath "build/" \
                      -exportOptionsPlist exportOptions.plist \
                      -allowProvisioningUpdates \
                      2>&1 | tee export.log
                  else
                    echo "Archive not found, skipping export"
                    exit 1
                  fi
                  
        artifacts:
            - build/*.ipa
            - build/App.xcarchive
            - build.log
            - export.log
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true