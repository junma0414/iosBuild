workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        scripts:
            - name: Install npm dependencies
              script: npm ci
                  
            - name: Build web assets
              script: npm run build
                  
            - name: Generate iOS project
              script: |
                  rm -rf ios
                  npx cap add ios
                  npx cap sync ios
                  
            - name: Fetch signing files via API
              script: |
                  app-store-connect fetch-signing-files "com.lingumate.app" \
                    --type IOS_APP_STORE \
                    --create \
                    --platform IOS
                  
            - name: Setup keychain and certificates
              script: |
                  keychain add-certificates
                  security unlock-keychain -p builder ~/Library/Keychains/login.keychain-db
                  security set-key-partition-list -S apple-tool:,apple: -s -k builder ~/Library/Keychains/login.keychain-db
                  
            - name: Apply provisioning profile
              script: |
                  xcode-project use-profiles
                  
            - name: Archive
              script: |
                  set -o pipefail
                  xcodebuild archive \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" \
                    -archivePath "build/App.xcarchive" \
                    -destination 'generic/platform=iOS' \
                    -allowProvisioningUpdates \
                    DEVELOPMENT_TEAM=${TEAM_ID} \
                    CODE_SIGN_STYLE=Manual
                  
            - name: Export IPA
              script: |
                  # 获取描述文件的真实名称和 UUID
                  PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
                  PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin 2>/dev/null)
                  PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin 2>/dev/null)
                  
                  echo "Using Provisioning Profile: $PROFILE_NAME ($PROFILE_UUID)"
                  
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store-connect</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                      <key>provisioningProfiles</key>
                      <dict>
                          <key>com.lingumate.app</key>
                          <string>${PROFILE_NAME}</string>
                      </dict>
                  </dict>
                  </plist>
                  EOF
                  
                  xcodebuild -exportArchive \
                    -archivePath "build/App.xcarchive" \
                    -exportPath "build/" \
                    -exportOptionsPlist exportOptions.plist \
                    -allowProvisioningUpdates
                  
        artifacts:
            - build/*.ipa
            - build/App.xcarchive
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true