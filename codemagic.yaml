workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        scripts:
            - name: Install npm dependencies
              script: |
                  npm ci
                  
            - name: Build web assets
              script: |
                  npm run build
                  
            - name: Generate iOS project
              script: |
                  rm -rf ios
                  npx cap add ios
                  npx cap sync ios
                  
            - name: Fetch signing files via API
              script: |
                  echo "=== Fetching signing files from App Store Connect API ==="
                  app-store-connect fetch-signing-files "com.lingumate.app" \
                    --type IOS_APP_STORE \
                    --create \
                    --platform IOS
                  
            - name: Apply provisioning profile and setup keychain
              script: |
                  echo "=== Applying provisioning profiles ==="
                  xcode-project use-profiles
                  
            - name: Set development team in project
              script: |
                  cd ios/App
                  echo "=== Setting DEVELOPMENT_TEAM in project.pbxproj ==="
                  sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${TEAM_ID};/g" App.xcodeproj/project.pbxproj
                  if ! grep -q "DEVELOPMENT_TEAM = ${TEAM_ID}" App.xcodeproj/project.pbxproj; then
                    sed -i '' "s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = ${TEAM_ID};/g" App.xcodeproj/project.pbxproj
                  fi
                  echo "DEVELOPMENT_TEAM set to ${TEAM_ID}"
                  
            - name: Archive
              script: |
                  set -o pipefail
                  echo "=== Starting Archive ==="
                  xcodebuild archive \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" \
                    -archivePath "build/App.xcarchive" \
                    -destination 'generic/platform=iOS' \
                    -allowProvisioningUpdates \
                    2>&1 | tee xcodebuild.log
                  
                  if [ ! -d "build/App.xcarchive" ]; then
                    echo "Archive failed!"
                    exit 1
                  fi
                  echo "Archive created successfully"
                  
            - name: Export IPA
              script: |
                  echo "=== Starting Export ==="
                  
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store-connect</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                  </dict>
                  </plist>
                  EOF
                  
                  xcodebuild -exportArchive \
                    -archivePath "build/App.xcarchive" \
                    -exportPath "build/" \
                    -exportOptionsPlist exportOptions.plist \
                    -allowProvisioningUpdates \
                    2>&1 | tee export.log
                  
                  echo "=== Checking for IPA ==="
                  ls -la build/*.ipa 2>&1 || echo "No IPA found"
                  
        artifacts:
            - build/*.ipa
            - build/App.xcarchive
            - xcodebuild.log
            - export.log
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true