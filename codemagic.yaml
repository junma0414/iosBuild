workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        scripts:
            - name: Install npm dependencies
              script: npm ci
                  
            - name: Build web assets
              script: npm run build
                  
            - name: Generate iOS project
              script: |
                  rm -rf ios
                  npx cap add ios
                  npx cap sync ios
                  
            - name: Set automatic signing
              script: |
                  cd ios/App
                  sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${TEAM_ID};/g" App.xcodeproj/project.pbxproj
                  sed -i '' "s/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Automatic;/g" App.xcodeproj/project.pbxproj
                  echo "Set Automatic signing with team ${TEAM_ID}"
                  
            - name: Archive and Export
              script: |
                  set -o pipefail
                  
                  # 归档
                  xcodebuild archive \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" \
                    -archivePath "build/App.xcarchive" \
                    -destination 'generic/platform=iOS' \
                    -allowProvisioningUpdates \
                    2>&1 | tee build.log
                  
                  # 导出
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store-connect</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                  </dict>
                  </plist>
                  EOF
                  
                  xcodebuild -exportArchive \
                    -archivePath "build/App.xcarchive" \
                    -exportPath "build/" \
                    -exportOptionsPlist exportOptions.plist \
                    -allowProvisioningUpdates \
                    2>&1 | tee export.log
                  
        artifacts:
            - build/*.ipa
            - build/App.xcarchive
            - build.log
            - export.log
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true