workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        scripts:
            - name: Install npm dependencies
              script: |
                  npm ci
                  
            - name: Build web assets
              script: |
                  npm run build
                  
            - name: Generate iOS project
              script: |
                  rm -rf ios
                  npx cap add ios
                  npx cap sync ios
                  
            - name: Fetch signing files
              script: |
                  app-store-connect fetch-signing-files "com.lingumate.app" \
                    --type IOS_APP_STORE \
                    --create \
                    --platform IOS
                  
            - name: Setup keychain
              script: |
                  keychain add-certificates
                  security unlock-keychain -p builder ~/Library/Keychains/login.keychain-db
                  security set-key-partition-list -S apple-tool:,apple: -s -k builder ~/Library/Keychains/login.keychain-db
                  xcode-project use-profiles
                  
            - name: Set manual signing in project
              script: |
                  cd ios/App
                  # 强制设置为手动签名
                  sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
                  # 设置团队 ID
                  sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${TEAM_ID};/g" App.xcodeproj/project.pbxproj
                  echo "Set manual signing with team ${TEAM_ID}"
                  
            - name: Build IPA
              script: |
                  # 获取描述文件 UUID
                  PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
                  if [ -z "$PROFILE_PATH" ]; then
                    echo "ERROR: No provisioning profile found!"
                    exit 1
                  fi
                  PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print UUID" 2>/dev/null)
                  echo "Using profile UUID: $PROFILE_UUID"
                  
                  # 创建 exportOptions.plist
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                      <key>provisioningProfiles</key>
                      <dict>
                          <key>com.lingumate.app</key>
                          <string>${PROFILE_UUID}</string>
                      </dict>
                  </dict>
                  </plist>
                  EOF
                  
                  # 清理
                  xcodebuild clean \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" || true
                  
                  # 归档 - 移除 -allowProvisioningUpdates
                  xcodebuild archive \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" \
                    -archivePath "build/App.xcarchive" \
                    -destination 'generic/platform=iOS'
                  
                  if [ ! -d "build/App.xcarchive" ]; then
                    echo "Archive failed!"
                    exit 1
                  fi
                  
                  # 导出 IPA - 移除 -allowProvisioningUpdates
                  xcodebuild -exportArchive \
                    -archivePath "build/App.xcarchive" \
                    -exportPath "build/" \
                    -exportOptionsPlist exportOptions.plist
                    
        artifacts:
            - build/*.ipa
            - build/*.xcarchive
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true