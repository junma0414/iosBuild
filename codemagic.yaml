workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials

      vars:
        BUNDLE_ID: "com.lingumate.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        COCOAPODS_DISABLE_STATS: "true"

      node: latest
      xcode: latest

    scripts:
      # =========================
      # Install dependencies
      # =========================
      - name: Install npm dependencies
        script: |
          npm ci

      # =========================
      # Build frontend
      # =========================
      - name: Build web assets
        script: |
          cp .env.production .env
          NODE_ENV=production npm run build

      # =========================
      # Sync Capacitor
      # =========================
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      # =========================
      # Install CocoaPods
      # =========================
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install --repo-update
          cd ../..

      # =========================
      # Initialize keychain
      # =========================
      - name: Initialize keychain
        script: |
          keychain initialize

      # =========================
      # Fetch provisioning profiles
      # =========================
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      # =========================
      # Install certificates
      # =========================
      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      # =========================
      # Unlock login keychain
      # =========================
      - name: Configure keychain access
        script: |
          keychain use-login

      # =========================
      # Apply provisioning profiles
      # =========================
      - name: Configure code signing
        script: |
          xcode-project use-profiles

      # =========================
      # Resolve Swift packages
      # =========================
      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME"

      # =========================
      # Clear broken export configs
      # =========================
      - name: Clear export overrides
        script: |
          unset XCODE_EXPORT_OPTIONS_PLIST
          unset CM_EXPORT_OPTIONS

      # =========================
      # Build IPA
      # =========================
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com
        notify:
          success: true
          failure: true