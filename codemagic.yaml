workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        scripts:
            - name: Install npm dependencies
              script: |
                  npm ci
                  
            - name: Build web assets
              script: |
                  npm run build
                  
            - name: Regenerate iOS project
              script: |
                  rm -rf ios
                  npx cap add ios
                  npx cap sync ios
                  rm -f ios/App/Podfile || true
                  rm -f ios/App/Podfile.lock || true
                  
            - name: Set up Manual Signing in project
              script: |
                  cd ios/App
                  # 备份
                  cp App.xcodeproj/project.pbxproj App.xcodeproj/project.pbxproj.backup
                  
                  # 强制设置为手动签名 (Manual)
                  sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
                  sed -i '' 's/CODE_SIGN_STYLE = ".*";/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
                  
                  # 清除所有旧的描述文件引用
                  sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' App.xcodeproj/project.pbxproj
                  sed -i '' '/PROVISIONING_PROFILE/d' App.xcodeproj/project.pbxproj
                  
                  echo "Switched to Manual signing style in project.pbxproj"
                  
            - name: Fetch iOS signing files
              script: |
                  app-store-connect fetch-signing-files "com.lingumate.app" \
                    --type IOS_APP_STORE \
                    --create \
                    --platform IOS
                    
            - name: Setup keychain and signing
              script: |
                  keychain add-certificates
                  security unlock-keychain -p builder ~/Library/Keychains/login.keychain-db
                  xcode-project use-profiles
                  
            - name: Build ipa
              script: |
                  PROJECT_PATH="ios/App/App.xcodeproj"
                  SCHEME="App"
                  ARCHIVE_PATH="build/App.xcarchive"
                  EXPORT_PATH="build"
                  
                  # 创建 exportOptions.plist (修正 plist 格式)
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>manageAppVersionAndBuildNumber</key>
                      <true/>
                      <key>provisioningProfiles</key>
                      <dict>
                          <key>com.lingumate.app</key>
                          <string>APP ID for lingumate ios_app_store 1778428934</string>
                      </dict>
                  </dict>
                  </plist>
                  EOF
                  
                  xcodebuild clean \
                    -project "$PROJECT_PATH" \
                    -scheme "$SCHEME" \
                    -allowProvisioningUpdates || true
                  
                  xcodebuild archive \
                    -project "$PROJECT_PATH" \
                    -scheme "$SCHEME" \
                    -archivePath "$ARCHIVE_PATH" \
                    -allowProvisioningUpdates \
                    -destination 'generic/platform=iOS'
                  
                  if [ ! -d "$ARCHIVE_PATH" ]; then
                    echo "Archive failed!"
                    exit 1
                  fi
                  
                  xcodebuild -exportArchive \
                    -archivePath "$ARCHIVE_PATH" \
                    -exportPath "$EXPORT_PATH" \
                    -exportOptionsPlist exportOptions.plist \
                    -allowProvisioningUpdates
                    
        artifacts:
            - build/*.ipa
            - build/*.xcarchive
            - /tmp/xcodebuild_logs/*.log
            - exportOptions.plist
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true