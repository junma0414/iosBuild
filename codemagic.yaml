workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        scripts:
            - name: Install npm dependencies
              script: |
                  echo "=== Install npm dependencies ==="
                  npm ci 2>&1 | tee npm_install.log
                  
            - name: Build web assets
              script: |
                  echo "=== Build web assets ==="
                  npm run build 2>&1 | tee build.log
                  
            - name: Generate iOS project
              script: |
                  echo "=== Generate iOS project ==="
                  rm -rf ios
                  npx cap add ios 2>&1 | tee cap_add.log
                  npx cap sync ios 2>&1 | tee cap_sync.log
                  
            - name: Debug - Check environment
              script: |
                  echo "=== Environment Variables ==="
                  echo "TEAM_ID = ${TEAM_ID}"
                  echo "KEY_ID = ${APP_STORE_CONNECT_KEY_IDENTIFIER:0:10}..."
                  echo "ISSUER_ID = ${APP_STORE_CONNECT_ISSUER_ID:0:10}..."
                  echo "Private key length = ${#APP_STORE_CONNECT_PRIVATE_KEY}"
                  echo ""
                  echo "=== Xcode version ==="
                  xcodebuild -version 2>&1 | tee xcode_version.log
                  echo ""
                  echo "=== Available schemes ==="
                  xcodebuild -project ios/App/App.xcodeproj -list 2>&1 | tee schemes.log
                  
            - name: Fetch signing files via API
              script: |
                  echo "=== Fetch signing files from App Store Connect API ==="
                  app-store-connect fetch-signing-files "com.lingumate.app" \
                    --type IOS_APP_STORE \
                    --create \
                    --platform IOS 2>&1 | tee fetch_signing.log
                  
                  echo "=== Downloaded provisioning profiles ==="
                  ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>&1 | tee profiles_list.log
                  
            - name: Apply provisioning profile
              script: |
                  echo "=== Applying provisioning profiles ==="
                  xcode-project use-profiles 2>&1 | tee use_profiles.log
                  
            - name: Set development team in project
              script: |
                  cd ios/App
                  echo "=== Setting DEVELOPMENT_TEAM in project.pbxproj ==="
                  sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${TEAM_ID};/g" App.xcodeproj/project.pbxproj
                  if ! grep -q "DEVELOPMENT_TEAM = ${TEAM_ID}" App.xcodeproj/project.pbxproj; then
                    sed -i '' "s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = ${TEAM_ID};/g" App.xcodeproj/project.pbxproj
                  fi
                  echo "DEVELOPMENT_TEAM set to ${TEAM_ID}"
                  echo "=== Verifying project.pbxproj ==="
                  grep "DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj | head -5
                  
            - name: Archive
              script: |
                  set -o pipefail
                  echo "=== Starting Archive ==="
                  xcodebuild archive \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" \
                    -archivePath "build/App.xcarchive" \
                    -destination 'generic/platform=iOS' \
                    -allowProvisioningUpdates \
                    2>&1 | tee xcodebuild.log
                  
                  if [ ! -d "build/App.xcarchive" ]; then
                    echo "Archive failed!"
                    ls -la build/ 2>&1 || echo "No build directory"
                    exit 1
                  fi
                  echo "Archive created successfully"
                  
            - name: Export IPA
              script: |
                  echo "=== Starting Export ==="
                  
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                  </dict>
                  </plist>
                  EOF
                  
                  echo "exportOptions.plist created:"
                  cat exportOptions.plist
                  
                  xcodebuild -exportArchive \
                    -archivePath "build/App.xcarchive" \
                    -exportPath "build/" \
                    -exportOptionsPlist exportOptions.plist \
                    -allowProvisioningUpdates \
                    2>&1 | tee export.log
                  
                  echo "=== Checking for IPA ==="
                  ls -la build/*.ipa 2>&1 || echo "No IPA found"
                  
        artifacts:
            - build/*.ipa
            - build/*.xcarchive
            - npm_install.log
            - build.log
            - cap_add.log
            - cap_sync.log
            - xcode_version.log
            - schemes.log
            - fetch_signing.log
            - profiles_list.log
            - use_profiles.log
            - xcodebuild.log
            - export.log
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true