# 工作流配置，可以定义多个不同的构建流程
workflows:
    # 这是给 iOS 平台定义的一个工作流
    ios-release-workflow:
        name: iOS Build for App Store Connect
        # 选择构建环境，mac_mini_m2 对于大多数项目性价比很高
        instance_type: mac_mini_m2
        # 最大构建时间（分钟）
        max_build_duration: 60

        environment:
            # 这里导入我们在 Codemagic 后台要设置的敏感信息组
            groups:
                - ios_credentials # 专门用来存放 iOS 证书和 API 密钥的组
            node: latest
            xcode: latest

        # 定义构建过程中要执行的脚本
        scripts:
            # 1. 安装 Node.js 依赖
            - name: Install npm dependencies
              script: |
                  npm ci

            # 2. 构建前端代码（生成 dist 文件夹）
            - name: Build web assets
              script: |
                  npm run build

            # 3. 重新生成 iOS 项目
            - name: Regenerate iOS project
              script: |
                  # 删除现有的 ios 文件夹
                  rm -rf ios
                  
                  # 重新添加 iOS 平台
                  npx cap add ios
                  
                  # 同步项目
                  npx cap sync ios
                  
                  # 删除可能残留的 Podfile
                  rm -f ios/App/Podfile || true
                  rm -f ios/App/Podfile.lock || true

            # 4. 获取 iOS 签名文件
            - name: Fetch iOS signing files
              script: |
                  app-store-connect fetch-signing-files "com.lingumate.app" --type IOS_APP_STORE --create

            # 5. 将证书添加到 macOS 钥匙串
            - name: Add certificates to keychain
              script: |
                  keychain add-certificates

            # 6. 设置 Xcode 项目的代码签名
            - name: Set up code signing settings
              script: |
                  xcode-project use-profiles

            # 7. 增加构建版本号
            - name: Increment build number
              script: |
                  cd ios/App
                  agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "6767740956") + 1))

            # 8. 手动构建 .ipa 文件（使用原始 xcodebuild 命令）
            - name: Build ipa
              script: |
                  # 设置项目路径
                  PROJECT_PATH="ios/App/App.xcodeproj"
                  SCHEME="App"
                  ARCHIVE_PATH="build/App.xcarchive"
                  EXPORT_PATH="build"
                  
                  # 清理之前的构建
                  xcodebuild clean \
                    -project "$PROJECT_PATH" \
                    -scheme "$SCHEME" \
                    -allowProvisioningUpdates
                  
                  # 归档（Archive）
                  xcodebuild archive \
                    -project "$PROJECT_PATH" \
                    -scheme "$SCHEME" \
                    -archivePath "$ARCHIVE_PATH" \
                    -allowProvisioningUpdates
                  
                  # 从归档导出 IPA
                  xcodebuild -exportArchive \
                    -archivePath "$ARCHIVE_PATH" \
                    -exportPath "$EXPORT_PATH" \
                    -exportOptionsPlist <(echo '{"method": "app-store", "teamID": "$TEAM_ID"}') \
                    -allowProvisioningUpdates

        # 指定 Codemagic 在构建完成后需要提取的文件
        artifacts:
            - build/*.ipa
            - build/*.xcarchive
            - /tmp/xcodebuild_logs/*.log

        # 配置构建产物的发布选项
        publishing:
            # 自动将 .ipa 上传到 App Store Connect
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true