workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.lingumate.app"

      node: latest
      xcode: latest

      certificates:
        - certificate: linguamate_distribution_cert

      provisioning_profiles:
        - profile: linguamate_distribution_provision

    scripts:
      ######################################################################
      # Install dependencies
      ######################################################################
      - name: Install npm dependencies
        script: |
          npm ci

      ######################################################################
      # Build web assets
      ######################################################################
      - name: Build web assets
        script: |
          npm run build

      ######################################################################
      # Sync Capacitor
      ######################################################################
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      ######################################################################
      # Install CocoaPods
      ######################################################################
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      ######################################################################
      # Show signing identities
      ######################################################################
      - name: Show signing identities
        script: |
          security find-identity -v -p codesigning || true

      ######################################################################
      # Archive app
      ######################################################################
      - name: Archive iOS app
        script: |
          set -e
          set -o pipefail

          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="AIVANA_codemagic"

      ######################################################################
      # Create ExportOptions.plist
      ######################################################################
      - name: Create ExportOptions.plist
        script: |
          cat > $CM_BUILD_DIR/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lingumate.app</key>
                  <string>AIVANA_codemagic</string>
              </dict>

          </dict>
          </plist>
          EOF

      ######################################################################
      # Export IPA
      ######################################################################
      - name: Export IPA
        script: |
          set -e
          set -o pipefail

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/exportOptions.plist"

      ######################################################################
      # Verify outputs
      ######################################################################
      - name: Verify build artifacts
        script: |
          echo "=== IPA FILES ==="
          find $CM_BUILD_DIR/build -name "*.ipa"

    ########################################################################
    # Artifacts
    ########################################################################
    artifacts:
      - build/ios/ipa/*.ipa
      - build/App.xcarchive

    ########################################################################
    # Publishing
    ########################################################################
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com

        notify:
          success: true
          failure: true
