workflows:
  ios-release-workflow:
    name: iOS Build for App Store Connect

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_credentials

      vars:
        BUNDLE_ID: "com.lingumate.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      node: latest
      xcode: latest

    scripts:
      # =========================
      # Install dependencies
      # =========================
      - name: Install npm dependencies
        script: |
          npm ci

      # =========================
      # Build web assets
      # =========================
      - name: Build web assets
        script: |
          cp .env.production .env
          NODE_ENV=production npm run build

      # =========================
      # Capacitor sync
      # =========================
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      # =========================
      # Ensure SPM placeholder exists
      # =========================
      - name: Create SPM placeholder package
        script: |
          mkdir -p ios/App/CapApp-SPM/Sources/CapApp-SPM

          cat > ios/App/CapApp-SPM/Package.swift <<EOF
          // swift-tools-version:5.3
          import PackageDescription

          let package = Package(
              name: "CapApp-SPM",
              products: [
                  .library(
                      name: "CapApp-SPM",
                      targets: ["CapApp-SPM"]
                  )
              ],
              targets: [
                  .target(
                      name: "CapApp-SPM",
                      path: "Sources/CapApp-SPM"
                  )
              ]
          )
          EOF

          cat > ios/App/CapApp-SPM/Sources/CapApp-SPM/Empty.swift <<EOF
          // Intentionally empty
          EOF

      # =========================
      # Initialize signing
      # =========================
      - name: Initialize keychain
        script: |
          keychain initialize

      # =========================
      # Fetch provisioning profiles
      # =========================
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      # =========================
      # Install certificates
      # =========================
      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      # =========================
      # Apply profiles to Xcode project
      # =========================
      - name: Configure code signing
        script: |
          xcode-project use-profiles

      # =========================
      # Resolve Swift packages
      # =========================
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME"

      # =========================
      # Build archive
      # =========================
      - name: Archive iOS app
        script: |
          set -e
          set -o pipefail

          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive"

      # =========================
      # Export IPA
      # =========================
      - name: Export IPA
        script: |
          set -e
          set -o pipefail

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -allowProvisioningUpdates

    artifacts:
      - build/ios/ipa/*.ipa
      - build/App.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - junma0614@gmail.com
        notify:
          success: true
          failure: true