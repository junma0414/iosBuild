workflows:
    ios-release-workflow:
        name: iOS Build for App Store Connect
        instance_type: mac_mini_m2
        max_build_duration: 60
        environment:
            groups:
                - ios_credentials
            node: latest
            xcode: latest
        scripts:
            - name: Install npm dependencies
              script: npm ci
                  
            - name: Build web assets
              script: npm run build
                  
            - name: Generate iOS project
              script: |
                  rm -rf ios
                  npx cap add ios
                  npx cap sync ios
                  
            - name: Debug - Check environment
              script: |
                  echo "=== Xcode version ==="
                  xcodebuild -version
                  echo "=== Available schemes ==="
                  xcodebuild -project ios/App/App.xcodeproj -list
                  echo "=== Check signing certificates ==="
                  security find-identity -v -p apple
                  echo "=== Check provisioning profiles ==="
                  ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles found"
                  
            - name: Clean build
              script: |
                  xcodebuild clean \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" 2>&1
                  
            - name: Archive (with full logging)
              script: |
                  set -o pipefail
                  xcodebuild archive \
                    -project "ios/App/App.xcodeproj" \
                    -scheme "App" \
                    -archivePath "build/App.xcarchive" \
                    -destination 'generic/platform=iOS' \
                    -allowProvisioningUpdates \
                    CODE_SIGN_STYLE=Manual \
                    PROVISIONING_PROFILE_SPECIFIER="APP ID for lingumate ios_app_store 1778428934" \
                    2>&1 | tee xcodebuild.log
                  
                  echo "=== Archive exit code: $? ==="
                  ls -la build/ 2>/dev/null || echo "No build directory"
                  
            - name: Export IPA
              script: |
                  if [ ! -d "build/App.xcarchive" ]; then
                    echo "Archive not found, skipping export"
                    exit 1
                  fi
                  
                  cat > exportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store</string>
                      <key>teamID</key>
                      <string>${TEAM_ID}</string>
                  </dict>
                  </plist>
                  EOF
                  
                  xcodebuild -exportArchive \
                    -archivePath "build/App.xcarchive" \
                    -exportPath "build/" \
                    -exportOptionsPlist exportOptions.plist \
                    -allowProvisioningUpdates 2>&1 | tee export.log
                    
        artifacts:
            - build/*.ipa
            - build/*.xcarchive
            - xcodebuild.log
            - export.log
            - /tmp/xcodebuild_logs/*.log
            
        publishing:
            app_store_connect:
                api_key: $APP_STORE_CONNECT_PRIVATE_KEY
                key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
                issuer_id: $APP_STORE_CONNECT_ISSUER_ID
                submit_to_testflight: true
            email:
                recipients:
                    - junma0614@gmail.com
                notify:
                    success: true
                    failure: true